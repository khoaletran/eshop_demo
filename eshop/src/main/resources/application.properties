spring.application.name=eshop
server.port=8080

# ===== MariaDB Database =====
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
spring.datasource.password=123456

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

app.ai.gemini.api-key=${GEMINI_API_KEY:demo_key}
app.ai.gemini.model=gemini-1.5-flash
app.ai.gemini.temperature=0.7
app.ai.gemini.max-output-tokens=1024

app.ai.vector.dimension=384
app.ai.vector.similarity-threshold=0.25
app.ai.vector.top-k=5

app.ai.tracking.enabled=true
app.ai.recommendation.decay-half-life-hours=72
app.ai.recommendation.weight.view=1.0
app.ai.recommendation.weight.search=1.5
app.ai.recommendation.weight.cart=3.0
app.ai.recommendation.weight.purchase=5.0
